<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シェアサイクルはどこにあるか — #30DayMapChallenge Day 1 Points</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0b0d12; color: #e8e8ea; font-family: "Noto Sans JP", sans-serif; }
    #map { position: absolute; inset: 0; }

    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: calc(100% - 32px);
      padding: 14px 16px;
      background: rgba(11, 13, 18, 0.72);
      border-radius: 8px;
      line-height: 1.5;
    }
    #panel h1 { font-size: 18px; font-weight: 700; }
    #panel .sub { font-size: 12px; color: #9a9ca3; }
    #panel ul { list-style: none; margin-top: 10px; font-size: 13px; }
    #panel li { display: flex; align-items: center; gap: 8px; }
    #panel .dot { width: 9px; height: 9px; border-radius: 50%; }
    #panel .n { margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; }
    #panel .note { margin-top: 10px; font-size: 11px; color: #9a9ca3; }

    .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib-inner { background: rgba(11, 13, 18, 0.72) !important; color: #c8c9ce !important; font-size: 11px; }
    .maplibregl-ctrl-attrib a { color: #c8c9ce; }
    .maplibregl-ctrl-attrib-button { filter: invert(1); }
    .maplibregl-popup-content { background: #1b1e26; color: #e8e8ea; font-size: 13px; }
    .maplibregl-popup-tip { border-top-color: #1b1e26 !important; border-bottom-color: #1b1e26 !important; }
  </style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>シェアサイクルはどこにあるか</h1>
  <div class="sub">#30DayMapChallenge 2026 Day 1 — Points</div>
  <ul>
    <li><span class="dot" style="background: #ff4d6d"></span>ドコモ・バイクシェア<span class="n">6,231</span></li>
    <li><span class="dot" style="background: #ffd23f"></span>HELLO CYCLING<span class="n">15,616</span></li>
  </ul>
  <div class="note">背景地図なし。点はすべてステーション（2026年10月29日時点）。<br>点の大きさは駐輪可能台数。</div>
</div>

<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  const COLOR = ["match", ["get", "operator"], "docomo", "#ff4d6d", "#ffd23f"];
  // 台数が 0 や 32767 の外れ値があるので 1〜40 に収める
  const CAP = ["min", ["max", ["coalesce", ["get", "capacity"], 1], 1], 40];
  const radius = (k) => [
    "interpolate", ["linear"], ["zoom"],
    4, ["*", k * 0.9, ["^", CAP, 0.25]],
    8, ["*", k * 1.3, ["^", CAP, 0.35]],
    12, ["*", k * 2.0, ["^", CAP, 0.45]],
    16, ["*", k * 4.0, ["^", CAP, 0.5]],
  ];

  const map = new maplibregl.Map({
    container: "map",
    hash: true,
    bounds: [[127.5, 25.8], [146.0, 45.6]],
    fitBoundsOptions: { padding: 20 },
    minZoom: 3,
    maxZoom: 17,
    attributionControl: false,
    style: {
      version: 8,
      sources: {
        stations: {
          type: "vector",
          url: "pmtiles://data/stations.pmtiles",
          attribution:
            '<a href="https://www.odpt.org/" target="_blank" rel="noopener">公共交通オープンデータセンター</a>' +
            "（ドコモ・バイクシェア / HELLO CYCLING, CC BY 4.0）",
        },
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": "#0b0d12" } },
        {
          id: "glow",
          type: "circle",
          source: "stations",
          "source-layer": "stations",
          paint: {
            "circle-color": COLOR,
            "circle-radius": radius(3),
            "circle-blur": 1,
            "circle-opacity": ["interpolate", ["linear"], ["zoom"], 4, 0.35, 12, 0.15],
          },
        },
        {
          id: "stations",
          type: "circle",
          source: "stations",
          "source-layer": "stations",
          paint: {
            "circle-color": COLOR,
            "circle-radius": radius(1),
            "circle-opacity": 0.9,
          },
        },
      ],
    },
  });

  map.addControl(new maplibregl.AttributionControl({ compact: true }));
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

  map.on("click", "stations", (e) => {
    const p = e.features[0].properties;
    const div = document.createElement("div");
    div.textContent = `${p.name}（${p.capacity ?? "—"}台）`;
    new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat).setDOMContent(div).addTo(map);
  });
  map.on("mouseenter", "stations", () => (map.getCanvas().style.cursor = "pointer"));
  map.on("mouseleave", "stations", () => (map.getCanvas().style.cursor = ""));
</script>
</body>
</html>
