<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside out — 陸と海を裏返した地球</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; }
  #map { position: absolute; inset: 0; }
  #credit { position: absolute; left: 12px; bottom: 10px; color: #c9d1dc; font: 12px/1.5 sans-serif; text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<div id="map"></div>
<div id="credit">
  標高を反転（陸↔海）／陸: Mapterhorn（Copernicus GLO-30 ほか, mapterhorn.com/attribution）／海底: GEBCO_2026 Grid
</div>
<script>
const params = new URLSearchParams(location.search);
const maxzoom = Number(params.get('maxzoom') || 5);
const map = new maplibregl.Map({
  container: 'map',
  center: [Number(params.get('lon') || 140), Number(params.get('lat') || 20)],
  zoom: Number(params.get('zoom') || 1.6),
  attributionControl: false,
  style: {
    version: 8,
    projection: { type: params.get('proj') || 'globe' },
    sky: { 'atmosphere-blend': 0.6 },
    sources: {
      dem: {
        type: 'raster-dem',
        tiles: [location.origin + '/output/tiles/{z}/{x}/{y}.webp'],
        tileSize: 512, maxzoom, encoding: 'terrarium'
      }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#05070d' } },
      {
        id: 'relief', type: 'color-relief', source: 'dem',
        paint: {
          'color-relief-color': [
            'interpolate', ['linear'], ['elevation'],
            -8800, '#08142e',
            -4000, '#0f2c5c',
            -1500, '#1d4f8a',
            -300,  '#3d7fb8',
            -1,    '#7fb6d9',
            0,     '#cfc7a3',
            1500,  '#a8a77a',
            3500,  '#8c7a55',
            5500,  '#b59c78',
            7500,  '#e3d6c3',
            10000, '#ffffff'
          ]
        }
      },
      {
        id: 'shade', type: 'hillshade', source: 'dem',
        paint: {
          'hillshade-exaggeration': 0.6,
          'hillshade-shadow-color': 'rgba(0,0,0,0.55)',
          'hillshade-highlight-color': 'rgba(255,255,255,0.25)'
        }
      }
    ]
  }
});
window.map = map;
// ?spin=度/秒 で地球を西から東へ回す（画面録画用）
const spin = Number(params.get('spin') || 0);
if (spin) {
  let last = null;
  const step = (t) => {
    if (last !== null) {
      const c = map.getCenter();
      map.jumpTo({ center: [c.lng + spin * (t - last) / 1000, c.lat] });
    }
    last = t;
    requestAnimationFrame(step);
  };
  map.once('idle', () => requestAnimationFrame(step));
}
</script>
</body>
</html>
