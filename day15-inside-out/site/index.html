<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside out — 陸と海を裏返した地球</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; }
  #map { position: absolute; inset: 0; }
  #credit { position: absolute; left: 12px; bottom: 10px; color: #c9d1dc; font: 12px/1.5 sans-serif; text-shadow: 0 0 4px #000; }
  #title { position: absolute; left: 28px; top: 22px; color: #f2f4f7; font: 700 40px/1.2 sans-serif; text-shadow: 0 0 6px #000; display: none; }
  #title small { display: block; margin-top: 6px; color: #c9d1dc; font: 400 18px/1.4 sans-serif; }
  body.rec #title { display: block; }
  body.rec #credit { left: 0; right: 0; bottom: 0; padding: 10px 28px 14px; font-size: 14px; background: rgba(5,7,13,.72); }
  .lbl { pointer-events: none; opacity: 0; transition: opacity .6s; color: #fff; font: 600 26px/1.15 sans-serif; text-shadow: 0 0 6px #000, 0 0 3px #000; white-space: nowrap; }
  .lbl.on { opacity: 1; }
  .lbl small { display: block; font: 400 16px/1.4 sans-serif; color: #e6ebf2; }
  .lbl::before { content: ''; position: absolute; left: -7px; top: -7px; width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 4px #000; }
  .lbl .t { position: relative; left: 14px; top: -14px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="credit">
  #30DayMapChallenge 2026 Day 15<br>
  陸: Mapterhorn（Copernicus GLO-30・国土地理院 基盤地図情報 ほか, mapterhorn.com/attribution）／海底: GEBCO Compilation Group (2026) GEBCO_2026 Grid
</div>
<div id="title">Inside out<small>陸と海を裏返した地球（標高の符号を反転）</small></div>
<script>
const params = new URLSearchParams(location.search);
if (params.has('rec')) document.body.classList.add('rec');
const maxzoom = Number(params.get('maxzoom') || 5);
const map = new maplibregl.Map({
  container: 'map',
  center: [Number(params.get('lon') || 140), Number(params.get('lat') || 20)],
  zoom: Number(params.get('zoom') || 1.6),
  attributionControl: false,
  style: {
    version: 8,
    projection: { type: params.get('proj') || 'globe' },
    sky: { 'atmosphere-blend': 0.6 },
    sources: {
      dem: {
        type: 'raster-dem',
        tiles: [location.origin + '/output/tiles/{z}/{x}/{y}.webp'],
        tileSize: 512, maxzoom, encoding: 'terrarium'
      }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#05070d' } },
      {
        id: 'relief', type: 'color-relief', source: 'dem',
        paint: {
          'color-relief-color': [
            'interpolate', ['linear'], ['elevation'],
            -8800, '#08142e',
            -4000, '#0f2c5c',
            -1500, '#1d4f8a',
            -300,  '#3d7fb8',
            -1,    '#7fb6d9',
            0,     '#cfc7a3',
            1500,  '#a8a77a',
            3500,  '#8c7a55',
            5500,  '#b59c78',
            7500,  '#e3d6c3',
            10000, '#ffffff'
          ]
        }
      },
      {
        id: 'shade', type: 'hillshade', source: 'dem',
        paint: {
          'hillshade-exaggeration': 0.6,
          'hillshade-shadow-color': 'rgba(0,0,0,0.55)',
          'hillshade-highlight-color': 'rgba(255,255,255,0.25)'
        }
      }
    ]
  }
});
window.map = map;
// ?spin=度/秒 で地球を西から東へ回す（画面録画用）
const spin = Number(params.get('spin') || 0);
if (spin) {
  let last = null;
  const step = (t) => {
    if (last !== null) {
      const c = map.getCenter();
      map.jumpTo({ center: [c.lng + spin * (t - last) / 1000, c.lat] });
    }
    last = t;
    requestAnimationFrame(step);
  };
  map.once('idle', () => requestAnimationFrame(step));
}
// ?tour: 高い山脈（もとの海溝）と深い海（もとの山）を順に回る（画面録画用）。値は裏返したタイル z7 の値
if (params.has('tour')) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const idle = () => new Promise((r) => (map.areTilesLoaded() ? r() : map.once('idle', r)));
  const fly = (center, zoom, duration) => new Promise((r) => { map.once('moveend', r); map.flyTo({ center, zoom, duration, essential: true }); });
  const label = (lon, lat, big, small) => {
    const el = document.createElement('div');
    el.className = 'lbl';
    el.innerHTML = `<div class="t">${big}<small>${small}</small></div>`;
    new maplibregl.Marker({ element: el, anchor: 'top-left' }).setLngLat([lon, lat]).addTo(map);
    return el;
  };
  const stops = [
    { center: [142.6, 14], zoom: 4.0, labels: [[142.59, 11.37, '10,922m', 'いちばん高い山（もとはマリアナ海溝）']] },
    { center: [142, 39], zoom: 4.0, labels: [[149.66, 43.78, '9,654m', 'もとは千島海溝'], [138.73, 35.36, '深さ 3,662m', 'もとは富士山']] },
    { center: [87, 30], zoom: 4.0, labels: [[86.93, 27.99, '深さ 8,535m', 'いちばん深い海（もとはエベレスト）']] },
    { center: [-71, -21], zoom: 3.8, labels: [[-72.83, -17.88, '8,514m', 'もとはペルー・チリ海溝'], [-68.54, -27.11, '深さ 6,784m', 'もとはアンデス山脈']] },
  ];
  map.once('idle', async () => {
    document.body.classList.add('tour-start');
    await wait(2500);
    for (const [i, st] of stops.entries()) {
      if (i === 2 || i === 3) { await fly([(map.getCenter().lng + st.center[0]) / 2, 10], 2.4, 3500); }
      await fly(st.center, st.zoom, 3500);
      await idle();
      const els = st.labels.map((l) => label(...l));
      await wait(50);
      els.forEach((e) => e.classList.add('on'));
      await wait(4000);
      els.forEach((e) => e.classList.remove('on'));
      await wait(600);
      els.forEach((e) => e.remove());
    }
    await fly([-40, 10], 2.6, 4000);
    await wait(2500);
    document.body.classList.add('tour-done');
  });
}
</script>
</body>
</html>
