<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路線図では同じ1本 — #30DayMapChallenge Day 2 Lines</title>
  <script type="module" crossorigin src="./assets/index-BpxTIgvq.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-1ap6aH9Y.css">

<body>
  <div id="map"></div>

  <section id="title" class="panel">
    <h1>路線図では、どの線も同じ1本</h1>
    <div class="sub">#30DayMapChallenge 2026 Day 2 — Lines</div>
    <p>
      路線図では、山手線もローカル線も同じ太さの線で描かれる。
      でも、走っている列車の数はまるで違う。全国の鉄道を、平日1日に走る列車の本数で描き直した。
    </p>
    <ol class="steps" id="steps">
      <li><button type="button" data-step="0">路線図のように描く</button></li>
      <li><button type="button" data-step="1">本数で描く</button></li>
      <li><button type="button" data-step="2">1時間に1本・30分に1本の線</button></li>
      <li><button type="button" data-step="3">いま走っていない線</button></li>
    </ol>
    <div id="caption"></div>
    <div class="legend" id="legend"></div>
    <p class="note">
      本数は平日に走る定期列車の1日あたりの本数で、上りと下りの平均。特急など特別料金の要る列車と新幹線は含まない。
      同じ区間を走る路線・会社の列車は合算している。2026年3〜4月の時刻表から数えたもの。
    </p>
  </section>

</body>
</html>
