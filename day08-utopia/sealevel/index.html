<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海が上がったら、関東は</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root { --panel: rgba(8, 14, 26, .82); --txt: #e6ecf5; --sub: #9fb0c8; --accent: #6fd3ff; }
  html, body { margin: 0; height: 100%; background: #0a0f1a; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; top: 16px; left: 16px; width: 380px; max-width: calc(100vw - 32px); box-sizing: border-box;
    background: var(--panel); color: var(--txt); padding: 16px 18px; border-radius: 10px;
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", sans-serif; backdrop-filter: blur(4px);
  }
  .panel .tag { color: var(--sub); font-size: 12px; letter-spacing: .02em; }
  .panel h1 { font-size: 24px; margin: 4px 0 10px; font-weight: 700; }
  .lv { display: flex; align-items: baseline; gap: 10px; }
  .lv .h { font-size: 44px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .lv .pop { font-size: 15px; white-space: nowrap; }
  .lv .pop b { font-size: 22px; }
  input[type=range] { width: 100%; margin: 8px 0 4px; accent-color: var(--accent); }
  .note { font-size: 13px; line-height: 1.6; min-height: 64px; color: var(--txt); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btns button { background: #1d2a40; color: var(--txt); border: 1px solid #33476a; border-radius: 6px; padding: 4px 9px; font-size: 13px; cursor: pointer; }
  .btns button.on { background: #2a4f7a; border-color: var(--accent); }
  .src { color: var(--sub); font-size: 11px; line-height: 1.5; margin-top: 10px; }
  .src a { color: var(--sub); }
  .lbl { color: #fff; font: 600 13px "BIZ UDPGothic", sans-serif; text-shadow: 0 0 3px #000, 0 0 6px #000; white-space: nowrap; pointer-events: none; }
  body.rec .panel .btns, body.rec .maplibregl-ctrl { display: none; }
  @media (max-width: 480px) { .panel { width: auto; right: 16px; padding: 12px; } .lv .h { font-size: 34px; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="tag">#30DayMapChallenge Day 8 — Utopia</div>
  <h1>海が上がったら、関東は</h1>
  <div class="lv"><span class="h" id="h">+0.0m</span><span class="pop" id="pop"></span></div>
  <input id="slider" type="range" min="0" max="10" step="0.1" value="0">
  <div class="note" id="note"></div>
  <div class="btns">
    <button data-h="1">+1m</button><button data-h="2">+2m</button><button data-h="3">+3m</button><button data-h="5">+5m</button>
    <button id="play">▶ 0→5m</button>
  </div>
  <div class="src">
    今の地形のまま海面を上げただけ（堤防・防潮堤や、これから積もる土砂は考えない）。ハザードマップではない。人数は関東1都6県の国勢調査2020 250mメッシュで、海とつながって沈むメッシュに住む人。<br>
    出典）標高: <a href="https://mapterhorn.com/" target="_blank">Mapterhorn</a>（日本は国土地理院 数値標高モデル）／写真: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>／人口: 国勢調査2020（e-Stat）／海面上昇の見通し: IPCC AR6 WG1 SPM B.5.3・B.5.4（1995〜2014年比の世界平均）
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.170.0/build/three.module.js";

const POP = await fetch("flood_pop.json").then(r => r.json()).catch(() => null);

// IPCC AR6 WG1 SPM（B.5.3・B.5.4）。世界平均・1995〜2014年比
const NOTES = [
  [0, "いまの海面（東京湾平均海面）。堤防がなければ、地盤が沈んだゼロメートル地帯（足立・葛飾・江東など）はすでに海より低い"],
  [0.6, "2100年、中くらいの排出（SSP2-4.5）で 0.44〜0.76m"],
  [1, "2100年、排出が非常に多いと（SSP5-8.5）0.63〜1.01m"],
  [2, "2100年に2m近く。排出が非常に多いと、可能性は低いが否定できない（SSP5-8.5、氷床の不確かさ）"],
  [3, "気温上昇を1.5℃に抑えても、この先2000年で約2〜3m。約6,000年前の縄文海進の頃も、関東の海面は今より2〜3m高かった"],
  [5, "2150年に5m近く。排出が非常に多いと、可能性は低いが否定できない。2℃に抑えた場合、2000年で2〜6m"],
  [7, "2℃を超えると、2000年でさらに上がる（5℃で19〜22m）"],
];

const map = new maplibregl.Map({
  container: "map",
  hash: true,
  center: [139.92, 35.62], zoom: 9.6, pitch: 62, bearing: -18, maxPitch: 85,
  style: {
    version: 8,
    sources: {
      photo: { type: "raster", tiles: ["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"], tileSize: 256, maxzoom: 18,
               attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル（全国最新写真）</a>" },
      dem: { type: "raster-dem", tiles: ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"], encoding: "terrarium", tileSize: 512, maxzoom: 16,
             attribution: "<a href='https://mapterhorn.com/attribution' target='_blank'>© Mapterhorn</a>（国土地理院 数値標高モデル）" },
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#0a0f1a" } },
      { id: "photo", type: "raster", source: "photo", paint: { "raster-saturation": -0.35, "raster-brightness-max": 0.85 } },
      { id: "shade", type: "hillshade", source: "dem", paint: { "hillshade-exaggeration": 0.35, "hillshade-shadow-color": "#000" } },
      { id: "sea", type: "color-relief", source: "dem", paint: { "color-relief-opacity": 0.9, "color-relief-color": seaColor(0) } },
    ],
    sky: { "sky-color": "#0d2340", "horizon-color": "#5f86b0", "fog-color": "#26405f", "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.6, "fog-ground-blend": 0.85 },
  },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
window.map = map;

function seaColor(h) {
  // h 以下を海の色に（深いほど濃く）。それより上は透明
  return ["interpolate", ["linear"], ["elevation"],
    h - 6, "rgba(10,40,80,1)", h, "rgba(28,92,150,1)", h + 0.1, "rgba(40,120,180,1)", h + 0.11, "rgba(0,0,0,0)"];
}

// ---- 波立つ海面（three.js のカスタムレイヤー） ----
const ORIGIN = [139.9, 35.6];
const EXAG = 1.5; // 地形の高さの強調
const SIZE = 400000; // 一辺400km の板
const waves = {
  id: "waves", type: "custom", renderingMode: "3d", h: 0,
  onAdd(m, gl) {
    this.camera = new THREE.Camera();
    this.scene = new THREE.Scene();
    const geo = new THREE.PlaneGeometry(SIZE, SIZE, 1, 1);
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 }, uCam: { value: new THREE.Vector3() } },
      vertexShader: `
        varying vec2 vP;
        void main() { vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vP;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
        float hgt(vec2 p){ // 波の高さ（向きと速さの違う波を重ねる）
          float t = uTime, s = 0.0, a = 1.0; vec2 q = p;
          for (int i = 0; i < 5; i++) {
            s += a * noise(q + vec2(t * 0.35, t * 0.22));
            q = mat2(1.6, 1.2, -1.2, 1.6) * q; a *= 0.5;
          }
          return s;
        }
        void main() {
          vec2 p = vP / 2600.0;            // 2.6km 角の模様
          float e = 0.02;
          float hx = hgt(p + vec2(e, 0.0)) - hgt(p - vec2(e, 0.0));
          float hy = hgt(p + vec2(0.0, e)) - hgt(p - vec2(0.0, e));
          vec3 n = normalize(vec3(-hx * 5.0, -hy * 5.0, 1.0));
          vec3 sun = normalize(vec3(-0.15, 0.85, 0.3));   // 北の低い太陽（カメラの正面）
          vec3 view = normalize(vec3(0.15, -0.55, 0.8));
          float diff = clamp(dot(n, normalize(vec3(-0.4, 0.3, 0.85))), 0.0, 1.0);
          float spec = pow(clamp(dot(reflect(-sun, n), view), 0.0, 1.0), 28.0);
          vec3 deep = vec3(0.02, 0.10, 0.22), shallow = vec3(0.10, 0.38, 0.60);
          vec3 c = mix(deep, shallow, smoothstep(0.55, 1.0, diff)) + vec3(1.0, 0.95, 0.85) * spec * 0.8;
          gl_FragColor = vec4(c, 0.8 + spec * 0.2);
        }`,
    });
    this.mesh = new THREE.Mesh(geo, this.mat);
    this.scene.add(this.mesh);
    this.renderer = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
    this.mc = maplibregl.MercatorCoordinate.fromLngLat(ORIGIN, 0);
    this.s = this.mc.meterInMercatorCoordinateUnits();
    this.t0 = performance.now();
  },
  render(gl, args) {
    const z = (this.h * EXAG + 0.3) * this.s; // 地形と同じ倍率。少し浮かせてちらつきを防ぐ
    const l = new THREE.Matrix4().makeTranslation(this.mc.x, this.mc.y, z).scale(new THREE.Vector3(this.s, -this.s, this.s));
    this.camera.projectionMatrix = new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix).multiply(l);
    this.mat.uniforms.uTime.value = (performance.now() - this.t0) / 1000;
    this.renderer.resetState();
    this.renderer.render(this.scene, this.camera);
    map.triggerRepaint();
  },
};

const LABELS = [
  ["東京駅", 139.767, 35.681], ["江東区", 139.817, 35.673], ["足立区", 139.805, 35.775], ["横浜", 139.62, 35.466],
  ["千葉", 140.123, 35.605], ["さいたま", 139.645, 35.861], ["川越", 139.485, 35.925], ["春日部", 139.752, 35.976],
  ["古河", 139.755, 36.178], ["渡良瀬遊水地", 139.68, 36.22], ["霞ヶ浦", 140.40, 36.05], ["銚子", 140.83, 35.73],
];

map.on("load", () => {
  map.setTerrain({ source: "dem", exaggeration: EXAG });
  map.addLayer(waves);
  for (const [t, lon, lat] of LABELS) {
    const el = document.createElement("div"); el.className = "lbl"; el.textContent = t;
    new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);
  }
  setH(0);
  window.waves = waves;
});

const slider = document.getElementById("slider");
function popAt(h) {
  if (!POP) return null;
  const L = POP.levels; let a = L[0], b = L[L.length - 1];
  for (let i = 0; i < L.length - 1; i++) if (L[i].h <= h && h <= L[i + 1].h) { a = L[i]; b = L[i + 1]; break; }
  const f = b.h === a.h ? 0 : (h - a.h) / (b.h - a.h);
  return a.pop + (b.pop - a.pop) * f;
}
function setH(h) {
  h = Math.round(h * 10) / 10;
  slider.value = h;
  document.getElementById("h").textContent = `+${h.toFixed(1)}m`;
  const p = popAt(h);
  document.getElementById("pop").innerHTML = p == null ? "" : `沈む所に <b>${(p / 1e4).toFixed(0)}万人</b>`;
  let note = NOTES[0][1];
  for (const [k, t] of NOTES) if (h >= k - 1e-6) note = t;
  document.getElementById("note").textContent = note;
  document.querySelectorAll(".btns button[data-h]").forEach(b => b.classList.toggle("on", +b.dataset.h === h));
  if (map.getLayer("sea")) map.setPaintProperty("sea", "color-relief-color", seaColor(h));
  waves.h = h;
  map.triggerRepaint();
}
slider.addEventListener("input", () => setH(+slider.value));
document.querySelectorAll(".btns button[data-h]").forEach(b => b.addEventListener("click", () => setH(+b.dataset.h)));

let anim = null;
document.getElementById("play").addEventListener("click", () => {
  cancelAnimationFrame(anim);
  const t0 = performance.now(), dur = 20000;
  const step = now => { const f = Math.min((now - t0) / dur, 1); setH(5 * f); if (f < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
});
if (new URLSearchParams(location.search).has("rec")) document.body.classList.add("rec");
</script>
</body>
</html>
