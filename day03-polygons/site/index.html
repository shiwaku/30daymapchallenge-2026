    <p>
      用途地域には、土地の広さに対してどれだけの床を建ててよいか（容積率）が決まっている。
      全国の用途地域の面を、容積率の高さに立ち上げた。色は用途地域の13種類。
    </p>

      国土交通省「都市計画決定GISデータ」に入っている市区町村だけを描いている。
