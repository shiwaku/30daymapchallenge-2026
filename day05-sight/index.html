<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地上から見えない新宿駅 — #30DayMapChallenge Day 5 Senses: Sight</title>
</head>
<body>
  <div id="map"></div>

  <section id="title" class="panel">
    <h1>地上から見えない新宿駅</h1>
    <div class="sub">#30DayMapChallenge 2026 Day 5 — Senses: Sight</div>
    <p id="lead"></p>
    <ul id="floors"></ul>
    <div class="toggles">
      <button type="button" id="t-above" class="on">地上の階</button>
      <button type="button" id="t-ground" class="on">地面</button>
      <button type="button" id="t-twsi" class="on">点字ブロック</button>
    </div>
    <p class="note">階の高さは見やすくするため、1階あたり30mで積んでいます（実際の深さではありません）。</p>
  </section>
