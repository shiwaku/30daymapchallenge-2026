<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森の下の山城 — #30DayMapChallenge Day 5 Senses: Sight</title>
  <script type="module" crossorigin src="./assets/index-DvF3mxzi.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CIUhvETe.css">
</head>
<body>
  <!-- 下が航空写真、上が CS立体図。上の地図を仕切りの右側だけ見せる -->
  <div id="photo" class="map"></div>
  <div id="cs" class="map"></div>
  <div id="labels"></div>

  <div id="divider" role="slider" aria-label="航空写真と CS立体図の境目" tabindex="0">
    <div class="line"></div>
    <div class="knob">⟷</div>
    <div class="tag left">航空写真</div>
    <div class="tag right">CS立体図</div>
  </div>

  <section id="title" class="panel">
    <h1>森の下の山城を見る</h1>
    <div class="sub">#30DayMapChallenge 2026 Day 5 — Senses: Sight</div>
    <p>
      航空写真では木しか見えない山も、航空レーザで測った地面の形（CS立体図）にすると、尾根を削って平らにした段や、尾根を断ち切る溝が出てくる。国の史跡の山城4つを、仕切りを動かして見比べる。
    </p>
    <ol class="castles" id="castles"></ol>
    <div id="card"></div>
    <div class="mode">
      <button type="button" data-mode="swipe" class="on">左右で比べる</button>
      <button type="button" data-mode="blend">写真に重ねる（乗算）</button>
    </div>
    <div class="legend">
      <span><i style="background:#c96a5a"></i>尾根（凸）</span>
      <span><i style="background:#5a7fb0"></i>谷（凹）</span>
      <span><i style="background:#5b5048"></i>急な斜面</span>
      <span><i style="background:#f3efe6"></i>平らな面</span>
    </div>
  </section>

  <footer id="credit"></footer>

</body>
</html>
